services:
  - type: web
    name: filmoteca-crud
    runtime: python
    rootDir: filmoteca-crud
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: filmoteca-crud-db
          property: connectionString
databases:
  - name: filmoteca-crud-db
    plan: free
    region: oregon
    databaseName: filmoteca
    user: filmoteca
    ipAllowList: []
